name: Database CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  validate-database:
    name: Validate PostgreSQL schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mottainai
          POSTGRES_PASSWORD: mottainai
          POSTGRES_DB: mottainai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mottainai -d mottainai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PostgreSQL connection
        env:
          PGPASSWORD: mottainai
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U mottainai \
            -d mottainai \
            -c "SELECT version();"

      - name: Execute database script
        env:
          PGPASSWORD: mottainai
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U mottainai \
            -d mottainai \
            -v ON_ERROR_STOP=1 \
            -f script/sql_completo.sql

      - name: Validate schema
        env:
          PGPASSWORD: mottainai
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U mottainai \
            -d mottainai \
            -c "SELECT schema_name FROM information_schema.schemata WHERE schema_name = 'mottainai';"