services:
  api:
    build:
      context: ${QA_API_BUILD_CONTEXT:-../../Mottainai-Spring-Api-SQL}
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mottainai_qa
      DB_USER: mottainai_qa_app
      DB_PASSWORD: ${QA_DB_APP_PASSWORD:?Set QA_DB_APP_PASSWORD in qa/.env}
      JWT_SECRET: ${QA_JWT_SECRET:?Set QA_JWT_SECRET in qa/.env}
      SPRING_FLYWAY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - qa_internal
      - qa_edge

  verify-api:
    image: curlimages/curl:8.10.1
    profiles: [verify]
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["sh", "-ec"]
    command: >-
      curl -fsS http://api:8080/actuator/health | grep -q '"status":"UP"';
      curl -fsS http://api:8080/api-docs | grep -q '"openapi"'
    networks:
      - qa_edge

networks:
  qa_edge: {}
