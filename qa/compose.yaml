name: mottainai-qa

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: mottainai_qa
      POSTGRES_USER: qa_admin
      POSTGRES_PASSWORD: ${QA_DB_ADMIN_PASSWORD:?Set QA_DB_ADMIN_PASSWORD in qa/.env}
      QA_DB_APP_PASSWORD: ${QA_DB_APP_PASSWORD:?Set QA_DB_APP_PASSWORD in qa/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/operational:/schema:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./app-role.sql:/qa/app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_admin -d mottainai_qa"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - qa_internal

  verify:
    image: postgres:15
    profiles: [verify]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: mottainai_qa
      PGUSER: mottainai_qa_app
      PGPASSWORD: ${QA_DB_APP_PASSWORD:?Set QA_DB_APP_PASSWORD in qa/.env}
    volumes:
      - ./verify.sql:/verify.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/verify.sql"]
    networks:
      - qa_internal

volumes:
  postgres_data:

networks:
  qa_internal:
    internal: true
